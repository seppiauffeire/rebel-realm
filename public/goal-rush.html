document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0px;\n  pointer-events: none;\n  opacity: 0.6;\n}\n\n/* ── SCROLL ANIMATIONS ── */\n.reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.7s ease, transform 0.7s ease; }\n.reveal.visible { opacity: 1; transform: none; }\n.reveal-delay-1 { transition-delay: 0.1s; }\n.reveal-delay-2 { transition-delay: 0.2s; }\n.reveal-delay-3 { transition-delay: 0.3s; }\n.reveal-delay-4 { transition-delay: 0.4s; }\n\n/* ── NAV ── */\nnav {\n  position: fixed; top: 0; left: 0; right: 0; z-index: 100;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 0 40px; height: 68px;\n  background: rgba(8,12,15,0.85);\n  backdrop-filter: blur(16px);\n  border-bottom: 1px solid var(--border);\n  transition: background 0.3s;\n}\n.nav-logo {\n  display: flex; align-items: center; gap: 10px;\n  text-decoration: none;\n}\n.nav-logo-mark {\n  width: 38px; height: 38px;\n  background: var(--green);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--display); font-size: 20px; color: var(--bg);\n  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);\n  flex-shrink: 0;\n}\n.nav-logo-text { font-family: var(--display); font-size: 24px; letter-spacing: 2px; color: var(--text); }\n.nav-links { display: flex; gap: 28px; align-items: center; }\n.nav-links a { font-size: 14px; font-weight: 500; text-decoration: none; color: var(--muted); letter-spacing: 0.5px; transition: color 0.2s; }\n.nav-links a:hover { color: var(--green); }\n.nav-cta {\n  background: var(--green); color: var(--bg);\n  border: none; padding: 10px 22px;\n  font-family: var(--display); font-size: 18px; letter-spacing: 1px;\n  cursor: pointer; transition: background 0.2s, transform 0.1s;\n  text-decoration: none; display: inline-block;\n  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);\n}\n.nav-cta:hover { background: #1fffa0; transform: translateY(-1px); }\n\n/* ── HERO ── */\n.hero {\n  position: relative; min-height: 100vh;\n  display: flex; flex-direction: column; justify-content: flex-end;\n  padding: 0 0 80px;\n  overflow: hidden;\n}\n.hero-bg {\n  position: absolute; inset: 0; z-index: 0;\n  background:\n    radial-gradient(ellipse 80% 60% at 60% 40%, rgba(0,232,122,0.08) 0%, transparent 70%),\n    radial-gradient(ellipse 60% 80% at 20% 80%, rgba(255,184,0,0.05) 0%, transparent 60%),\n    var(--bg);\n}\n/* Pitch lines */\n.hero-bg::after {\n  content: '';\n  position: absolute; inset: 0;\n  background-image:\n    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);\n  background-size: 80px 80px;\n}\n.hero-media-placeholder {\n  position: absolute; inset: 0; z-index: 1;\n  display: flex; align-items: center; justify-content: center;\n  background: linear-gradient(to bottom, transparent 40%, var(--bg) 100%);\n}\n.hero-media-inner {\n  width: 65%; max-width: 800px; aspect-ratio: 16/9;\n  border: 1px solid var(--border);\n  background: var(--bg2);\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\n  gap: 12px; color: var(--muted); font-size: 14px;\n  position: relative; overflow: hidden;\n}\n.hero-media-inner::before {\n  content: '';\n  position: absolute; inset: 0;\n  background: repeating-linear-gradient(\n    45deg, transparent, transparent 20px,\n    rgba(255,255,255,0.02) 20px, rgba(255,255,255,0.02) 21px\n  );\n}\n.hero-media-icon { font-size: 48px; opacity: 0.3; }\n.hero-content {\n  position: relative; z-index: 2;\n  padding: 0 60px;\n  max-width: 820px;\n}\n.hero-eyebrow {\n  display: inline-flex; align-items: center; gap: 8px;\n  border: 1px solid rgba(0,232,122,0.3);\n  color: var(--green); padding: 6px 14px;\n  font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;\n  margin-bottom: 24px;\n}\n.hero-eyebrow::before { content: ''; width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: blink 1.5s infinite; }\n@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }\n.hero-title {\n  font-family: var(--display); font-size: clamp(64px, 9vw, 120px);\n  line-height: 0.95; letter-spacing: 2px;\n  color: var(--text);\n  margin-bottom: 24px;\n}\n.hero-title em { color: var(--green); font-style: normal; }\n.hero-sub {\n  font-size: 18px; color: var(--muted); font-weight: 300;\n  max-width: 520px; margin-bottom: 36px; line-height: 1.7;\n}\n.hero-actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }\n.btn-primary {\n  background: var(--green); color: var(--bg);\n  font-family: var(--display); font-size: 22px; letter-spacing: 1px;\n  padding: 14px 36px; border: none; cursor: pointer;\n  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);\n  transition: background 0.2s, transform 0.15s;\n  text-decoration: none; display: inline-block;\n}\n.btn-primary:hover { background: #1fffa0; transform: translateY(-2px); }\n.btn-ghost {\n  border: 1px solid var(--border); color: var(--muted);\n  background: transparent; font-size: 15px; font-weight: 500;\n  padding: 14px 28px; cursor: pointer; transition: border-color 0.2s, color 0.2s;\n  text-decoration: none; display: inline-block;\n}\n.btn-ghost:hover { border-color: var(--green); color: var(--green); }\n.hero-badge {\n  display: flex; align-items: center; gap: 8px;\n  font-size: 13px; color: var(--gold); font-weight: 500;\n}\n.hero-badge::before { content: '⚡'; }\n\n/* ── PHILOSOPHY TICKER ── */\n.ticker {\n  background: var(--green); color: var(--bg);\n  overflow: hidden; height: 48px; display: flex; align-items: center;\n  position: relative; z-index: 10;\n}\n.ticker-track {\n  display: flex; gap: 0;\n  animation: ticker 20s linear infinite;\n  white-space: nowrap;\n}\n@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n.ticker-item {\n  font-family: var(--display); font-size: 22px; letter-spacing: 2px;\n  padding: 0 40px; display: flex; align-items: center; gap: 16px;\n}\n.ticker-dot { width: 6px; height: 6px; background: rgba(0,0,0,0.3); border-radius: 50%; flex-shrink: 0; }\n\n/* ── SECTION COMMONS ── */\nsection { position: relative; z-index: 1; }\n.container { max-width: 1200px; margin: 0 auto; padding: 0 60px; }\n.section-pad { padding: 100px 0; }\n.section-eyebrow {\n  font-size: 11px; font-weight: 600; letter-spacing: 3px;\n  text-transform: uppercase; color: var(--green);\n  margin-bottom: 16px;\n}\n.section-title {\n  font-family: var(--display); font-size: clamp(40px, 5vw, 64px);\n  letter-spacing: 1px; line-height: 1; color: var(--text);\n  margin-bottom: 16px;\n}\n.section-sub { font-size: 17px; color: var(--muted); font-weight: 300; max-width: 580px; line-height: 1.7; }\n.divider { width: 48px; height: 3px; background: var(--green); margin: 20px 0; }\n\n/* ── BIG THREE ── */\n.pillars-bg { background: var(--bg2); }\n.pillars-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 60px; flex-wrap: wrap; gap: 20px; }\n.pillars-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; }\n.pillar {\n  background: var(--bg3); padding: 48px 40px;\n  position: relative; overflow: hidden;\n  transition: background 0.3s;\n  cursor: default;\n}\n.pillar::before {\n  content: '';\n  position: absolute; top: 0; left: 0; right: 0; height: 3px;\n  background: var(--green); transform: scaleX(0); transform-origin: left;\n  transition: transform 0.4s ease;\n}\n.pillar:hover::before { transform: scaleX(1); }\n.pillar:hover { background: var(--surface); }\n.pillar-number {\n  font-family: var(--display); font-size: 120px; line-height: 1;\n  color: rgba(255,255,255,0.04); position: absolute;\n  top: 20px; right: 24px; letter-spacing: -4px;\n}\n.pillar-icon-row { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }\n.pillar-tag {\n  font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;\n  color: var(--green); border: 1px solid rgba(0,232,122,0.3);\n  padding: 4px 10px;\n}\n/* Card mockup */\n.card-mock {\n  width: 100px; height: 140px; flex-shrink: 0;\n  border: 1px solid rgba(255,255,255,0.15);\n  border-radius: 6px;\n  background: linear-gradient(160deg, var(--surface) 0%, #0e1c28 100%);\n  display: flex; flex-direction: column;\n  overflow: hidden; position: relative;\n  box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);\n  transition: transform 0.3s, box-shadow 0.3s;\n}\n.pillar:hover .card-mock { transform: rotate(-3deg) translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.6); }\n.card-mock-img {\n  flex: 1;\n  background: repeating-linear-gradient(\n    -35deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 4px,\n    transparent 4px, transparent 12px\n  );\n  position: relative;\n}\n.card-mock-img::after {\n  content: attr(data-label);\n  position: absolute; inset: 0;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 28px; opacity: 0.4;\n}\n.card-mock-footer {\n  background: rgba(0,0,0,0.4); padding: 6px 8px;\n  border-top: 1px solid rgba(255,255,255,0.06);\n  font-size: 8px; letter-spacing: 1px; text-transform: uppercase;\n  color: var(--muted);\n}\n.card-mock-bar { height: 3px; width: 100%; }\n.pillar-name { font-family: var(--display); font-size: 36px; letter-spacing: 1px; margin-bottom: 12px; }\n.pillar-desc { font-size: 15px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; }\n.pillar-ability {\n  border-left: 3px solid var(--green);\n  padding: 10px 16px;\n  background: rgba(0,232,122,0.05);\n  font-size: 14px; color: var(--text); font-style: italic;\n}\n\n/* ── MECHANICS ── */\n.mechanics-bg { background: var(--bg); }\n.mechanics-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }\n.mechanics-left { position: sticky; top: 100px; }\n.mechanics-steps { display: flex; flex-direction: column; gap: 2px; }\n.mech-step {\n  display: flex; gap: 0; align-items: stretch;\n  border: 1px solid var(--border);\n  background: var(--bg2);\n  transition: border-color 0.3s, background 0.3s;\n  cursor: pointer;\n}\n.mech-step:hover, .mech-step.active { border-color: rgba(0,232,122,0.3); background: var(--bg3); }\n.mech-step-num {\n  width: 56px; flex-shrink: 0;\n  background: var(--bg3);\n  border-right: 1px solid var(--border);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--display); font-size: 24px; color: var(--muted);\n  transition: background 0.3s, color 0.3s;\n}\n.mech-step:hover .mech-step-num,\n.mech-step.active .mech-step-num { background: var(--green); color: var(--bg); }\n.mech-step-body { padding: 20px 24px; }\n.mech-step-title { font-family: var(--display); font-size: 22px; letter-spacing: 0.5px; margin-bottom: 6px; }\n.mech-step-desc { font-size: 14px; color: var(--muted); line-height: 1.65; }\n\n/* Stamina display */\n.stamina-display { margin-top: 16px; }\n.stamina-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }\n.stamina-pips { display: flex; gap: 3px; flex-wrap: wrap; }\n.pip { width: 16px; height: 16px; border-radius: 2px; background: var(--green); transition: opacity 0.3s; }\n.pip.empty { background: var(--surface); opacity: 0.4; }\n\n/* Chain visual */\n.chain-visual { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; }\n.chain-node {\n  padding: 6px 14px; font-size: 13px; font-weight: 500;\n  border: 1px solid var(--border); background: var(--surface);\n  white-space: nowrap;\n}\n.chain-node.finisher { background: var(--green); color: var(--bg); border-color: var(--green); font-weight: 700; }\n.chain-arrow { color: var(--muted); font-size: 18px; }\n.odds-evens {\n  display: flex; gap: 12px; margin-top: 12px;\n}\n.oe-box {\n  flex: 1; padding: 14px; text-align: center; font-family: var(--display);\n  font-size: 28px; letter-spacing: 1px;\n}\n.oe-box.odds { border: 1px solid rgba(0,232,122,0.4); color: var(--green); }\n.oe-box.evens { border: 1px solid rgba(255,184,0,0.4); color: var(--gold); }\n.oe-box span { display: block; font-family: var(--body); font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }\n\n/* ── COLLECTIONS ── */\n.collections-bg { background: var(--bg2); }\n.collections-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-top: 60px; }\n.coll-card {\n  border: 1px solid var(--border);\n  background: var(--bg3);\n  overflow: hidden;\n  transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;\n  cursor: pointer;\n}\n.coll-card:hover { transform: translateY(-6px); border-color: rgba(0,232,122,0.3); box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,232,122,0.1); }\n.coll-img {\n  aspect-ratio: 3/4; position: relative;\n  background: var(--bg2);\n  display: flex; align-items: center; justify-content: center;\n  overflow: hidden;\n}\n.coll-img-placeholder {\n  position: absolute; inset: 0;\n  background: repeating-linear-gradient(\n    -45deg,\n    rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 8px,\n    transparent 8px, transparent 16px\n  );\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\n  gap: 8px; font-size: 12px; color: var(--muted); text-align: center; padding: 20px;\n}\n.coll-img-placeholder .placeholder-icon { font-size: 36px; opacity: 0.25; }\n.coll-badge {\n  position: absolute; top: 12px; left: 12px;\n  font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;\n  padding: 4px 10px; background: var(--green); color: var(--bg);\n}\n.coll-badge.special { background: var(--gold); }\n.coll-body { padding: 20px 20px 24px; }\n.coll-era { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }\n.coll-name { font-family: var(--display); font-size: 26px; letter-spacing: 0.5px; margin-bottom: 6px; }\n.coll-desc { font-size: 13px; color: var(--muted); line-height: 1.55; }\n\n/* ── COMPETITIVE ── */\n.competitive-bg { background: var(--bg); }\n.competitive-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }\n.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 40px; }\n.stat-box { padding: 32px 28px; background: var(--bg2); border: 1px solid var(--border); }\n.stat-box:hover { border-color: rgba(0,232,122,0.2); }\n.stat-num { font-family: var(--display); font-size: 64px; letter-spacing: -1px; color: var(--green); line-height: 1; }\n.stat-num.gold { color: var(--gold); }\n.stat-label { font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: 500; }\n.comp-placeholder {\n  aspect-ratio: 4/3; border: 1px solid var(--border);\n  background: var(--bg2); position: relative; overflow: hidden;\n  display: flex; align-items: center; justify-content: center;\n  flex-direction: column; gap: 12px; color: var(--muted); font-size: 14px; text-align: center;\n}\n.comp-placeholder::before {\n  content: '';\n  position: absolute; inset: 0;\n  background: repeating-linear-gradient(\n    60deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 4px,\n    transparent 4px, transparent 20px\n  );\n}\n.comp-placeholder-icon { font-size: 48px; opacity: 0.2; position: relative; }\n\n/* ── COMMUNITY ── */\n.community-bg {\n  background: var(--bg2);\n  border-top: 1px solid var(--border);\n}\n.community-inner { text-align: center; max-width: 700px; margin: 0 auto; }\n.discord-cta {\n  display: inline-flex; align-items: center; gap: 14px;\n  border: 1px solid rgba(88,101,242,0.4);\n  background: rgba(88,101,242,0.08);\n  padding: 16px 32px; margin: 32px 0;\n  font-size: 18px; font-weight: 500;\n  color: #8891f7; text-decoration: none;\n  transition: border-color 0.3s, background 0.3s;\n}\n.discord-cta:hover { border-color: rgba(88,101,242,0.7); background: rgba(88,101,242,0.15); }\n.discord-logo { font-size: 24px; }\n.cta-row { display: flex; gap: 16px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }\n.tiers {\n  margin-top: 40px; display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; text-align: left;\n}\n.tier {\n  border: 1px solid var(--border); padding: 20px 22px;\n  background: var(--bg3);\n}\n.tier-name { font-family: var(--display); font-size: 20px; letter-spacing: 0.5px; margin-bottom: 6px; }\n.tier-price { color: var(--gold); font-size: 22px; font-weight: 600; margin-bottom: 12px; }\n.tier-desc { font-size: 13px; color: var(--muted); line-height: 1.65; }\n\n/* ── FOOTER ── */\nfooter {\n  background: var(--bg); border-top: 1px solid var(--border);\n  padding: 40px 60px;\n  display: flex; justify-content: space-between; align-items: center;\n  flex-wrap: wrap; gap: 20px;\n}\n.footer-logo { font-family: var(--display); font-size: 22px; letter-spacing: 2px; }\n.footer-links { display: flex; gap: 28px; }\n.footer-links a { font-size: 14px; color: var(--muted); text-decoration: none; transition: color 0.2s; }\n.footer-links a:hover { color: var(--green); }\n.footer-copy { font-size: 13px; color: var(--muted); }\n\n/* ── TWEAKS ── */\n#tweaks-panel {\n  display: none; position: fixed; bottom: 24px; right: 24px;\n  background: var(--bg2); border: 1px solid var(--border);\n  padding: 20px; z-index: 9999; width: 240px;\n  box-shadow: 0 16px 40px rgba(0,0,0,0.6);\n  font-family: var(--body);\n}\n#tweaks-panel h3 { font-size: 16px; margin-bottom: 16px; color: var(--green); font-family: var(--display); letter-spacing: 1px; }\n#tweaks-panel label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; }\n#tweaks-panel select, #tweaks-panel input[type=range] { width: 100%; margin-top: 4px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: var(--body); font-size: 13px; padding: 4px 6px; }\n\n/* Responsive */\n@media (max-width: 900px) {\n  .pillars-grid { grid-template-columns: 1fr; }\n  .mechanics-layout { grid-template-columns: 1fr; }\n  .mechanics-left { position: static; }\n  .collections-grid { grid-template-columns: repeat(2,1fr); }\n  .competitive-layout { grid-template-columns: 1fr; }\n  .tiers { grid-template-columns: 1fr; }\n  nav { padding: 0 20px; }\n  .container { padding: 0 24px; }\n  .hero-content { padding: 0 24px; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- ══ NAV ══ -->\n<nav>\n  <a class=\"nav-logo\" href=\"#\">\n    <div class=\"nav-logo-mark\">GR<\u002Fdiv>\n    <div class=\"nav-logo-text\">GOAL RUSH<\u002Fdiv>\n  <\u002Fa>\n  <div class=\"nav-links\">\n    <a href=\"#pillars\">The Big Three<\u002Fa>\n    <a href=\"#mechanics\">How to Play<\u002Fa>\n    <a href=\"#collections\">Collections<\u002Fa>\n    <a href=\"#competitive\">Competitive<\u002Fa>\n    <a href=\"#community\">Community<\u002Fa>\n    <a href=\"#community\" class=\"nav-cta\">BACK THE CAMPAIGN<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ══ HERO ══ -->\n<section class=\"hero\">\n  <div class=\"hero-bg\"><\u002Fdiv>\n  <div class=\"hero-media-placeholder\">\n    <div class=\"hero-media-inner\">\n      <div class=\"hero-media-icon\">▶<\u002Fdiv>\n      <div style=\"position:relative;z-index:1;font-size:13px;color:var(--muted);text-align:center;\">Promotional gameplay video<br><span style=\"font-size:11px;opacity:0.6;\">16:9 · autoplay loop recommended<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero-content\">\n    <div class=\"hero-eyebrow reveal\">Campaign Live Now<\u002Fdiv>\n    <h1 class=\"hero-title reveal reveal-delay-1\">THE CLOSEST<br>EXPERIENCE TO<br><em>SOCCER<\u002Fem><\u002Fh1>\n    <p class=\"hero-sub reveal reveal-delay-2\">A tactical two-player card game where you step into the role of Manager. Build your 60-card dream team. Out-strategize your opponent. No dice. No luck. All strategy.<\u002Fp>\n    <div class=\"hero-actions reveal reveal-delay-3\">\n      <a href=\"#community\" class=\"btn-primary\">⚽ BACK ON KICKSTARTER<\u002Fa>\n      <a href=\"#mechanics\" class=\"btn-ghost\">Watch Gameplay →<\u002Fa>\n      <div class=\"hero-badge\">Limited early-bird tiers available<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ TICKER ══ -->\n<div class=\"ticker\">\n  <div class=\"ticker-track\">\n    <div class=\"ticker-item\"><span>NO DICE ROLLS<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>NO LUCK<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>ALL STRATEGY<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>60-CARD DECK<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>10 TURNS · 90 MINUTES<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>TACTICAL TRADING CARD GAME<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>NO DICE ROLLS<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>NO LUCK<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>ALL STRATEGY<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>60-CARD DECK<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>10 TURNS · 90 MINUTES<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"ticker-item\"><span>TACTICAL TRADING CARD GAME<\u002Fspan><div class=\"ticker-dot\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ══ THE BIG THREE ══ -->\n<section id=\"pillars\" class=\"pillars-bg section-pad\">\n  <div class=\"container\">\n    <div class=\"pillars-header\">\n      <div class=\"reveal\">\n        <div class=\"section-eyebrow\">The Big Three<\u002Fdiv>\n        <div class=\"section-title\">Every Deck Starts With<br>Three Decisions<\u002Fdiv>\n        <div class=\"divider\"><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"section-sub reveal\" style=\"text-align:right;\">Before you play a single card, these three choices define your entire strategy — and your identity on the pitch.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"pillars-grid\">\n\n      <div class=\"pillar reveal\">\n        <div class=\"pillar-number\">1<\u002Fdiv>\n        <div class=\"pillar-icon-row\">\n          <div class=\"card-mock\">\n            <div class=\"card-mock-bar\" style=\"background:var(--gold);height:3px;\"><\u002Fdiv>\n            <div class=\"card-mock-img\" data-label=\"🧠\"><\u002Fdiv>\n            <div class=\"card-mock-footer\">Manager · Legendary<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pillar-tag\">Playstyle<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pillar-name\">THE MANAGER<\u002Fdiv>\n        <p class=\"pillar-desc\">Defines your entire approach — Aggressive, Defensive, or Controlling. Each Manager unlocks a unique once-per-game ability that can swing momentum when you need it most.<\u002Fp>\n        <div class=\"pillar-ability\">e.g. <strong>El Midas<\u002Fstrong> — Discard 3 cards, Draw 3 cards<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pillar reveal reveal-delay-2\">\n        <div class=\"pillar-number\">2<\u002Fdiv>\n        <div class=\"pillar-icon-row\">\n          <div class=\"card-mock\">\n            <div class=\"card-mock-bar\" style=\"background:var(--accent2, #3a7bd5);height:3px;background:var(--green);\"><\u002Fdiv>\n            <div class=\"card-mock-img\" data-label=\"📐\"><\u002Fdiv>\n            <div class=\"card-mock-footer\">Formation · Tactical<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pillar-tag\">Structure<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pillar-name\">THE FORMATION<\u002Fdiv>\n        <p class=\"pillar-desc\">Dictates where your Idols are placed on the pitch. Complete your formation — 4-4-2, 4-3-3, and more — to unlock powerful Formation Actions exclusive to your shape.<\u002Fp>\n        <div class=\"pillar-ability\">Unlocks: <strong>Wing Overload<\u002Fstrong> · <strong>Constant Pressure<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pillar reveal reveal-delay-3\">\n        <div class=\"pillar-number\">3<\u002Fdiv>\n        <div class=\"pillar-icon-row\">\n          <div class=\"card-mock\">\n            <div class=\"card-mock-bar\" style=\"height:3px;background:#e74c3c;\"><\u002Fdiv>\n            <div class=\"card-mock-img\" data-label=\"🧤\"><\u002Fdiv>\n            <div class=\"card-mock-footer\">Goalkeeper · Elite<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pillar-tag\">Last Line of Defense<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pillar-name\">THE GOALKEEPER<\u002Fdiv>\n        <p class=\"pillar-desc\">The ultimate mind game. Your keeper doesn't just react — they read the attacker. Using the Odds or Evens mechanic, the defending player predicts the shot total. Pure psychology, zero luck.<\u002Fp>\n        <div class=\"pillar-ability\">⚡ Odds / Evens — predict the attacker's sum to make the save<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ MECHANICS ══ -->\n<section id=\"mechanics\" class=\"mechanics-bg section-pad\">\n  <div class=\"container\">\n    <div class=\"mechanics-layout\">\n      <div class=\"mechanics-left reveal\">\n        <div class=\"section-eyebrow\">How to Play<\u002Fdiv>\n        <div class=\"section-title\">The Engine Behind the Beautiful Game<\u002Fdiv>\n        <div class=\"divider\"><\u002Fdiv>\n        <p class=\"section-sub\" style=\"margin-bottom:48px;\">Four interlocking systems recreate the ebb and flow of a real 90-minute match — turn by turn, chain by chain.<\u002Fp>\n\n        <div class=\"mechanics-steps\">\n          <div class=\"mech-step active\">\n            <div class=\"mech-step-num\">1<\u002Fdiv>\n            <div class=\"mech-step-body\">\n              <div class=\"mech-step-title\">STAMINA<\u002Fdiv>\n              <p class=\"mech-step-desc\">Start with 20 Stamina. It decays each turn — simulating real player fatigue. Every card costs energy. Manage it wisely.<\u002Fp>\n              <div class=\"stamina-display\">\n                <div class=\"stamina-label\"><span>Turn 5 stamina<\u002Fspan><span style=\"color:var(--green)\">12 / 20<\u002Fspan><\u002Fdiv>\n                <div class=\"stamina-pips\">\n                  <div class=\"pip\"><\u002Fdiv><div class=\"pip\"><\u002Fdiv><div class=\"pip\"><\u002Fdiv><div class=\"pip\"><\u002Fdiv><div class=\"pip\"><\u002Fdiv>\n                  <div class=\"pip\"><\u002Fdiv><div class=\"pip\"><\u002Fdiv><div class=\"pip\"><\u002Fdiv><div class=\"pip\"><\u002Fdiv><div class=\"pip\"><\u002Fdiv>\n                  <div class=\"pip\"><\u002Fdiv><div class=\"pip\"><\u002Fdiv>\n                  <div class=\"pip empty\"><\u002Fdiv><div class=\"pip empty\"><\u002Fdiv><div class=\"pip empty\"><\u002Fdiv><div class=\"pip empty\"><\u002Fdiv><div class=\"pip empty\"><\u002Fdiv>\n                  <div class=\"pip empty\"><\u002Fdiv><div class=\"pip empty\"><\u002Fdiv><div class=\"pip empty\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"mech-step\">\n            <div class=\"mech-step-num\">2<\u002Fdiv>\n            <div class=\"mech-step-body\">\n              <div class=\"mech-step-title\">ATTACKING CHAINS<\u002Fdiv>\n              <p class=\"mech-step-desc\">Link 2+ Attacking Actions before you can attempt a Finisher. Every action played lets you draw a card — rewarding beautiful, flowing football.<\u002Fp>\n              <div class=\"chain-visual\">\n                <div class=\"chain-node\">Pass<\u002Fdiv>\n                <div class=\"chain-arrow\">→<\u002Fdiv>\n                <div class=\"chain-node\">Dribble<\u002Fdiv>\n                <div class=\"chain-arrow\">→<\u002Fdiv>\n                <div class=\"chain-node\">Pass<\u002Fdiv>\n                <div class=\"chain-arrow\">→<\u002Fdiv>\n                <div class=\"chain-node finisher\">⚽ Finisher<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"mech-step\">\n            <div class=\"mech-step-num\">3<\u002Fdiv>\n            <div class=\"mech-step-body\">\n              <div class=\"mech-step-title\">DEFENSIVE INTERACTION<\u002Fdiv>\n              <p class=\"mech-step-desc\">Tackles and Interceptions can break any chain — but only if your player is positioned adjacent to the ball carrier. Positioning is everything.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"mech-step\">\n            <div class=\"mech-step-num\">4<\u002Fdiv>\n            <div class=\"mech-step-body\">\n              <div class=\"mech-step-title\">THE GOALKEEPER'S MIND GAME<\u002Fdiv>\n              <p class=\"mech-step-desc\">After a Finisher is declared, only a Reaction card or the keeper's read can stop it.<\u002Fp>\n              <div class=\"odds-evens\">\n                <div class=\"oe-box odds\">ODDS<span>Predict odd sum<\u002Fspan><\u002Fdiv>\n                <div class=\"oe-box evens\">EVENS<span>Predict even sum<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Right: pitch diagram placeholder -->\n      <div class=\"reveal reveal-delay-2\">\n        <div style=\"border:1px solid var(--border);aspect-ratio:3/4;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:14px;position:relative;overflow:hidden;\">\n          <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 1px,transparent 60px),repeating-linear-gradient(90deg,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 1px,transparent 60px);\"><\u002Fdiv>\n          <!-- Center circle -->\n          <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,0.06);\"><\u002Fdiv>\n          <div style=\"position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(255,255,255,0.05);\"><\u002Fdiv>\n          <div style=\"position:relative;z-index:1;text-align:center;padding:20px;\">\n            <div style=\"font-size:40px;margin-bottom:12px;opacity:0.15;\">⚽<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.7;\">Pitch diagram /<br>card layout illustration<br><span style=\"font-size:11px;opacity:0.5;\">Formation + Idol placement<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ COLLECTIONS ══ -->\n<section id=\"collections\" class=\"collections-bg section-pad\">\n  <div class=\"container\">\n    <div class=\"reveal\">\n      <div class=\"section-eyebrow\">Collections<\u002Fdiv>\n      <div class=\"section-title\">Historic Teams.<br>Legendary Players.<\u002Fdiv>\n      <div class=\"divider\"><\u002Fdiv>\n      <p class=\"section-sub\">From TOTY award winners to the greatest squads in football history — each set is a love letter to a golden era of the game.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"collections-grid\">\n\n      <div class=\"coll-card reveal reveal-delay-1\">\n        <div class=\"coll-img\">\n          <div class=\"coll-img-placeholder\">\n            <div class=\"placeholder-icon\">🏆<\u002Fdiv>\n            <div>TOTY 2022–2024<br>Key Art<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"coll-badge\">Starter<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"coll-body\">\n          <div class=\"coll-era\">Current Era · Balanced<\u002Fdiv>\n          <div class=\"coll-name\">TOTY 2022–2024<\u002Fdiv>\n          <p class=\"coll-desc\">The definitive balanced starter. Iconic players from three award cycles, built for every archetype.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"coll-card reveal reveal-delay-2\">\n        <div class=\"coll-img\">\n          <div class=\"coll-img-placeholder\">\n            <div class=\"placeholder-icon\">⭐<\u002Fdiv>\n            <div>Legends<br>Key Art<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"coll-badge\">Starter<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"coll-body\">\n          <div class=\"coll-era\">1990s · 2000s · 2010s<\u002Fdiv>\n          <div class=\"coll-name\">LEGENDS<\u002Fdiv>\n          <p class=\"coll-desc\">Icons of the game. The Maestro, The Robot — reimagined as tactical powerhouses in card form.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"coll-card reveal reveal-delay-3\">\n        <div class=\"coll-img\">\n          <div class=\"coll-img-placeholder\">\n            <div class=\"placeholder-icon\">🇧🇷<\u002Fdiv>\n            <div>Brazil 2002<br>Key Art<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"coll-badge special\">World Cup<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"coll-body\">\n          <div class=\"coll-era\">2002 · Champions<\u002Fdiv>\n          <div class=\"coll-name\">BRAZIL 2002<\u002Fdiv>\n          <p class=\"coll-desc\">The most dangerous attacking squad ever assembled. Relive the most entertaining World Cup in history.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"coll-card reveal reveal-delay-4\">\n        <div class=\"coll-img\">\n          <div class=\"coll-img-placeholder\">\n            <div class=\"placeholder-icon\">🇦🇷<\u002Fdiv>\n            <div>Argentina 2022<br>Key Art<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"coll-badge special\">World Cup<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"coll-body\">\n          <div class=\"coll-era\">2022 · Champions<\u002Fdiv>\n          <div class=\"coll-name\">ARGENTINA 2022<\u002Fdiv>\n          <p class=\"coll-desc\">The crowning of a generation. A squad built around grit, genius, and a once-in-a-lifetime Maestro.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <div style=\"margin-top:32px;padding:24px 28px;border:1px solid var(--border);background:var(--bg3);display:flex;gap:32px;flex-wrap:wrap;align-items:center;\" class=\"reveal\">\n      <div style=\"flex:1;min-width:240px;\">\n        <div style=\"font-family:var(--display);font-size:22px;letter-spacing:0.5px;margin-bottom:6px;\">Designed to Collect<\u002Fdiv>\n        <p style=\"font-size:14px;color:var(--muted);line-height:1.7;\">Intentionally slow pace of discovery — fostering the magic of finding rare variants, foil cards, and signed editions. Playmats · Card Sleeves · Collector Portfolios available separately.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:24px;flex-wrap:wrap;\">\n        <div style=\"text-align:center;\"><div style=\"font-family:var(--display);font-size:40px;color:var(--green)\">6+<\u002Fdiv><div style=\"font-size:12px;color:var(--muted);letter-spacing:1px;\">SETS DESIGNED<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center;\"><div style=\"font-family:var(--display);font-size:40px;color:var(--gold)\">∞<\u002Fdiv><div style=\"font-size:12px;color:var(--muted);letter-spacing:1px;\">VARIANTS TO FIND<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ COMPETITIVE ══ -->\n<section id=\"competitive\" class=\"competitive-bg section-pad\">\n  <div class=\"container\">\n    <div class=\"competitive-layout\">\n      <div class=\"reveal\">\n        <div class=\"section-eyebrow\">Competitive Scene<\u002Fdiv>\n        <div class=\"section-title\">Built to<br>Compete.<\u002Fdiv>\n        <div class=\"divider\"><\u002Fdiv>\n        <p class=\"section-sub\">Goal Rush is designed from the ground up for organized play. Every mechanic is built around decisive, high-skill moments — no variance, no excuses.<\u002Fp>\n        <div class=\"stats-grid\">\n          <div class=\"stat-box reveal reveal-delay-1\">\n            <div class=\"stat-num\">0<\u002Fdiv>\n            <div class=\"stat-label\">Dice rolls. Ever.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stat-box reveal reveal-delay-2\">\n            <div class=\"stat-num gold\">3<\u002Fdiv>\n            <div class=\"stat-label\">Archetypes to master<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stat-box reveal reveal-delay-3\">\n            <div class=\"stat-num\">10<\u002Fdiv>\n            <div class=\"stat-label\">Turns per match<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stat-box reveal reveal-delay-4\">\n            <div class=\"stat-num gold\">6+<\u002Fdiv>\n            <div class=\"stat-label\">Historic collections<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"comp-placeholder reveal reveal-delay-2\">\n        <div class=\"comp-placeholder-icon\">🏟<\u002Fdiv>\n        <div style=\"position:relative;z-index:1;padding:20px;font-size:13px;line-height:1.7;text-align:center;\">\n          Competitive scene image<br>\n          <span style=\"font-size:11px;opacity:0.5;\">Tournament bracket / event photography<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ COMMUNITY ══ -->\n<section id=\"community\" class=\"community-bg section-pad\">\n  <div class=\"container\">\n    <div class=\"community-inner reveal\">\n      <div class=\"section-eyebrow\">Community &amp; Campaign<\u002Fdiv>\n      <div class=\"section-title\">JOIN THE PITCH<\u002Fdiv>\n      <div class=\"divider\" style=\"margin:20px auto;\"><\u002Fdiv>\n      <p class=\"section-sub\" style=\"margin:0 auto;\">Find games, share deck ideas, shape the rules — and be part of building Goal Rush from the coach's whiteboard to your table.<\u002Fp>\n      <a href=\"#\" class=\"discord-cta\">\n        <span class=\"discord-logo\">💬<\u002Fspan>\n        Join our Discord Community\n      <\u002Fa>\n      <div class=\"tiers reveal\">\n        <div class=\"tier\">\n          <div class=\"tier-name\">EARLY BIRD<\u002Fdiv>\n          <div class=\"tier-price\">$XX<\u002Fdiv>\n          <p class=\"tier-desc\">One Starter Deck + Rulebook + exclusive early-backer card sleeve design.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"tier\">\n          <div class=\"tier-name\">MANAGER<\u002Fdiv>\n          <div class=\"tier-price\">$XX<\u002Fdiv>\n          <p class=\"tier-desc\">Two Starter Decks + Playmat + limited variant cards. Name in the rulebook credits.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"tier\">\n          <div class=\"tier-name\">BE A PLAYER<\u002Fdiv>\n          <div class=\"tier-price\">$XX<\u002Fdiv>\n          <p class=\"tier-desc\">All of the above + your likeness as a signed limited-edition Idol card in the game.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cta-row reveal\">\n        <a href=\"#\" class=\"btn-primary\" style=\"font-size:22px;padding:16px 44px;\">⚽ BACK THE CAMPAIGN<\u002Fa>\n        <a href=\"#mechanics\" class=\"btn-ghost\">Learn the Rules →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ FOOTER ══ -->\n<footer>\n  <div class=\"footer-logo\">GOAL RUSH TCG<\u002Fdiv>\n  <div class=\"footer-links\">\n    <a href=\"#\">Rules PDF<\u002Fa>\n    <a href=\"#\">Press Kit<\u002Fa>\n    <a href=\"#\">Discord<\u002Fa>\n    <a href=\"#\">Contact<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"footer-copy\">© 2026 Goal Rush. All rights reserved.<\u002Fdiv>\n<\u002Ffooter>\n\n<!-- ══ TWEAKS ══ -->\n<div id=\"tweaks-panel\">\n  <h3>TWEAKS<\u002Fh3>\n  <label>Accent Color\n    <select id=\"tw-accent\" onchange=\"applyTweaks()\">\n      <option value=\"#00e87a\">Electric Green<\u002Foption>\n      <option value=\"#00cfff\">Sky Blue<\u002Foption>\n      <option value=\"#ff4d6d\">Red Card<\u002Foption>\n      <option value=\"#ffb800\">Gold<\u002Foption>\n    <\u002Fselect>\n  <\u002Flabel>\n  <label>Background Tone\n    <select id=\"tw-bg\" onchange=\"applyTweaks()\">\n      <option value=\"#080c0f\">Near Black<\u002Foption>\n      <option value=\"#0a080f\">Deep Purple<\u002Foption>\n      <option value=\"#080f0a\">Forest Dark<\u002Foption>\n    <\u002Fselect>\n  <\u002Flabel>\n  <label>Ticker Speed\n    <input type=\"range\" id=\"tw-speed\" min=\"8\" max=\"40\" value=\"20\" step=\"2\" oninput=\"applyTweaks()\">\n  <\u002Flabel>\n<\u002Fdiv>\n\n<script>\n// Scroll reveal\nconst observer = new IntersectionObserver(entries => {\n  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } });\n}, { threshold: 0.12 });\ndocument.querySelectorAll('.reveal').forEach(el => observer.observe(el));\n\n// Make hero reveals immediate\ndocument.querySelectorAll('.hero .reveal').forEach(el => {\n  setTimeout(() => el.classList.add('visible'), 100 + parseInt(el.className.match(/delay-(\\d)/)?.[1] || 0) * 150);\n});\n\n// Mechanic steps interactive\ndocument.querySelectorAll('.mech-step').forEach(step => {\n  step.addEventListener('click', () => {\n    document.querySelectorAll('.mech-step').forEach(s => s.classList.remove('active'));\n    step.classList.add('active');\n  });\n});\n\n// Tweaks\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  \"accent\": \"#00e87a\",\n  \"bg\": \"#080c0f\",\n  \"speed\": 20\n}/*EDITMODE-END*/;\nfunction applyTweaks() {\n  const accent = document.getElementById('tw-accent')?.value || TWEAK_DEFAULTS.accent;\n  const bg = document.getElementById('tw-bg')?.value || TWEAK_DEFAULTS.bg;\n  const speed = document.getElementById('tw-speed')?.value || TWEAK_DEFAULTS.speed;\n  document.documentElement.style.setProperty('--green', accent);\n  document.documentElement.style.setProperty('--bg', bg);\n  document.documentElement.style.setProperty('--bg2', bg.replace(/0f$/, '18').replace(/14/, '1c'));\n  document.querySelector('.ticker-track').style.animationDuration = speed + 's';\n  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accent, bg, speed: Number(speed) } }, '*');\n}\n\nwindow.addEventListener('message', e => {\n  if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').style.display = 'block';\n  if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').style.display = 'none';\n});\nwindow.parent.postMessage({ type: '__edit_mode_available' }, '*');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
